name: Assemble signed Windows update
on:
  push:
    branches: [main]
    paths:
      - '.github/update-parts/**'
      - '.github/workflows/assemble-windows.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and publish encrypted package
        shell: bash
        run: |
          set -euo pipefail
          source_dir=.github/update-parts
          target=RaspberryPI_Addons/Raspi-Scripte/Raspi-Scripte.zip.enc
          test -f "$source_dir/part-08"
          cat "$source_dir"/part-{00..08} > "$target"
          echo "576ca5d1a69322b202e4f69a39c978560cb13dd7e9ae0ff61cddf2056b2dd28b  $target" | sha256sum --check -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r "$source_dir"
          git add "$target"
          git commit -m "Assemble signed Windows 0.6.32 update"
          git push
