name: Publish verified Windows compatibility update
on:
  push:
    branches: [main]
    paths:
      - '.github/update-parts/**'
      - '.github/workflows/assemble-windows.yml'
permissions:
  contents: write
concurrency:
  group: windows-compatibility-release
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify encrypted parts and publish package with matching version metadata
        if: ${{ hashFiles('.github/update-parts/manifest.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          source = pathlib.Path('.github/update-parts')
          release = pathlib.Path('RaspberryPI_Addons/Raspi-Scripte')
          manifest = json.loads((source / 'manifest.json').read_text())
          assert manifest['version'] == '0.7.1'
          output = bytearray()
          for part in manifest['parts']:
              name = part['name']
              assert pathlib.PurePosixPath(name).name == name and name.startswith('part-')
              data = (source / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == part['sha256'], name
              output.extend(data)
          assert output[:8] == b'RSPKG001'
          assert hashlib.sha256(output).hexdigest() == manifest['encryptedSha256']
          assert len(output) < 100 * 1024 * 1024
          assert hashlib.sha256((release / 'Raspi-Scripte-Content.zip.enc').read_bytes()).hexdigest() == manifest['encryptedContentSha256']
          (release / 'Raspi-Scripte.zip.enc').write_bytes(output)
          (release / 'version.txt').write_text(manifest['version'] + '\n')
          (release / 'update-manifest.json').write_text(json.dumps(manifest['updateManifest'], indent=2) + '\n')
          (release / 'release-notes.json').write_text(json.dumps(manifest['releaseNotes'], ensure_ascii=False, indent=2) + '\n')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'rm', '-r', str(source)], check=True)
          subprocess.run(['git', 'add', str(release)], check=True)
          subprocess.run(['git', 'commit', '-m', 'Publish Windows 0.7.1 compatibility update and matching manifests'], check=True)
          subprocess.run(['git', 'push'], check=True)
          print('Verified 0.7.1 compatibility package and version metadata published together.')
          PY
